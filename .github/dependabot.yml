version: 2

# Действия в ci.yml прибиты к коммитам, а не к тегам: тег можно передвинуть, и
# `@v4` завтра окажется другим кодом с теми же правами. Обратная сторона — сами
# по себе они больше не обновляются никогда, поэтому обновляет их Dependabot.
#
# ⚠️ Настройки ниже — про то, чтобы он не превращался в шум:
#
#  * **группировка** — все обновления одной экосистемы приезжают ОДНИМ
#    пул-реквестом. Одна ветка, один прогон, один разбор;
#  * **раз в месяц**, а не в неделю. Обновления безопасности приходят отдельно и
#    расписания не ждут — частый опрос покупает только шум;
#  * **мажорные прыжки игнорируются** (см. ниже).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 2

  # Базовый образ Dockerfile.
  #
  # ⚠️ Тег `python:3.12-slim` уже плавающий: он сам подтягивает 3.12.x. То есть
  # исправления приезжают при каждой пересборке, и Dependabot тут может
  # предложить только смену ветки языка — ровно то, чего мы не хотим случайно.
  # Поэтому игнорируем и мажорную, и минорную: 3.12 → 3.13 меняет интерпретатор,
  # а переход на новую версию языка — отдельная задача с прогоном тестов на ней,
  # а не автоматический пул-реквест.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      base-images:
        patterns: ['*']

  # Зависимости сервиса. Список не продублирован нигде: образ ставит их из того
  # же requirements.txt, что и CI, поэтому пул-реквесты бота проходят без
  # ручной правки.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # ⚠️ Мажорные обновления не предлагаем: мажор меняет поведение, а не чинит
      # его, и приезжать он должен осознанно. Здесь это особенно чувствительно —
      # весь доступ к источнику держится на curl_cffi и его профилях
      # impersonation, а разбор страниц на селекторах поверх beautifulsoup4.
      # Обратная сторона честная: если исправление уязвимости выйдет только в
      # новом мажоре, пул-реквеста не будет — придёт оповещение во вкладке
      # Security, и обновлять надо руками.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      runtime:
        patterns: ['*']
    open-pull-requests-limit: 2

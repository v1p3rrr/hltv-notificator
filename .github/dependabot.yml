version: 2

# Actions in ci.yml are pinned to commits rather than tags: a tag can be moved,
# and `@v4` may be different code with the same permissions tomorrow. The flip
# side is that they then never update on their own, so Dependabot updates them.
#
# ⚠️ The settings below are about keeping it from turning into noise:
#
#  * **grouping** — all updates for one ecosystem arrive in ONE pull request.
#    One branch, one run, one review;
#  * **monthly**, not weekly. Security updates arrive separately and do not
#    wait for a schedule — polling more often buys only noise;
#  * **major jumps are ignored** (see below).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 2

  # The Dockerfile's base image.
  #
  # ⚠️ The tag `python:3.12-slim` already floats: it picks up 3.12.x by itself.
  # That is, fixes arrive on every rebuild, and the only thing Dependabot could
  # propose here is a change of language branch — exactly what we do not want
  # by accident. So both major and minor are ignored: 3.12 → 3.13 changes the
  # interpreter, and moving to a new language version is a separate job with a
  # test run on it, not an automatic pull request.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      base-images:
        patterns: ['*']

  # The service's dependencies. The list is not duplicated anywhere: the image
  # installs them from the same requirements.txt that CI uses, so the bot's
  # pull requests go through without manual edits.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # ⚠️ Major updates are not proposed: a major changes behaviour rather
      # than fixing it, and it should arrive deliberately. That matters
      # particularly here — all access to the source rests on curl_cffi and its
      # impersonation profiles, and page parsing on selectors over
      # beautifulsoup4. The honest flip side: if a vulnerability fix ships only
      # in a new major, there will be no pull request — a notice appears in the
      # Security tab and the update has to be done by hand.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      runtime:
        patterns: ['*']
    open-pull-requests-limit: 2

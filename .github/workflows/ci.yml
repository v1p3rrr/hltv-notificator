name: CI

# Tests run on every pull request to main and on every push to main.
# Publishing the image happens ONLY on a push. A pull-request run has no access
# to the secrets and must not have any: the code in a PR has not been read by
# anyone yet, and the Docker Hub token grants the right to overwrite the image
# that later goes to the server.
#
# The separation is carried through: the image is built in a job WITHOUT the
# token and travels onward as an archive. The job that does have the token does
# not even check the repository out — it unpacks the ready archive and pushes
# the layers to the registry.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# The default token permissions are read-only on the repository. Jobs that need
# more are granted it by name and in the smallest amount.
permissions:
  contents: read

# Push after push: the previous run is cancelled. Otherwise two runs could
# reach publishing out of order and `latest` would not be the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left in .git/config: the later steps do not need
          # it, and any of them — from installing dependencies to running the
          # tests — could have made use of it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencies
        # The single source of versions is requirements.txt, the same one the
        # image uses. Duplicating the list in the Dockerfile is not allowed: it
        # would drift.
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          python -m pip install --disable-pip-version-check --no-cache-dir pytest

      - name: pytest
        # The tests run against fixtures from docs/recon/fixtures — real HLTV
        # pages captured during recon. A live source is no good for tests:
        # matches are rare, and an overtime or a dropped connection cannot be
        # reproduced on demand.
        run: python -m pytest

  image:
    name: Build the image and scan it
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The version is computed by this job — it has the repository. The publish
    # job takes the ready number and never looks at the sources.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: ver
        run: |
          version=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/hltv_notify/__init__.py').read_text(encoding='utf-8')).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A vX.Y.Z tag must match the version in the code: otherwise an image
          # numbered 1.2.3 would report somebody else's number.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src/hltv_notify/__init__.py"
            exit 1
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # OCI labels: which repository and commit the image was built from, and
      # when. They have to end up in the layers, so they are applied here, at
      # build time, not at publish time. The image name is irrelevant to labels.
      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: hltv-notificator
          tags: type=raw,value=${{ steps.ver.outputs.version }}

      # There is no login and no secret in this job — and all the code that
      # runs during the build (pip, RUN from the Dockerfile) runs right here.
      - name: Build into an archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: hltv-notificator:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The docker exporter cannot do provenance attestations; what the
          # image was built by is attested by the cosign signature in the
          # publish job.
          provenance: false

      - name: Unpack the archive for scanning
        run: docker load --input "$RUNNER_TEMP/image.tar"

      # `ignore-unfixed` is deliberate: we fail only where there is something
      # to fix.
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hltv-notificator:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # On a pull request there is nothing to publish and no point in moving
      # the archive around.
      - name: Pass the archive on
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          # The archive is only needed by the next job of this same run.
          retention-days: 1
          # The layers inside are already compressed; compressing harder just
          # burns minutes.
          compression-level: 1

  publish:
    name: Publish to Docker Hub
    needs: [image]
    # A pull request never reaches this job — see the comment on `on`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The secret lives in an environment rather than in the repository
    # settings: an environment can be given a list of branches it is available
    # from, and a manual approval.
    environment: dockerhub
    permissions:
      contents: read
      id-token: write   # OIDC for the keyless cosign signature
    steps:
      # ⚠️ This job has NO checkout step, and that is the main thing about it.
      # Not a single line from the repository ends up next to the token: no
      # Dockerfile, no conftest.py. The image arrives as a ready archive,
      # `docker load` merely unpacks it and `docker push` moves the layers into
      # the registry. Nothing from the image is executed in the process.
      - name: Credentials and image name
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          OVERRIDE: ${{ vars.DOCKERHUB_IMAGE }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$USERNAME" || { echo "::error::The variable DOCKERHUB_USERNAME is not set"; exit 1; }
          test -n "$TOKEN"    || { echo "::error::The secret DOCKERHUB_TOKEN is not set"; exit 1; }
          # DOCKERHUB_IMAGE is only needed when publishing into an organisation
          # rather than a personal namespace.
          echo "IMAGE=${OVERRIDE:-$USERNAME/hltv-notificator}" >> "$GITHUB_ENV"
          echo "Publishing to ${OVERRIDE:-$USERNAME/hltv-notificator}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Unpack the image
        run: docker load --input "$RUNNER_TEMP/image.tar"

      # Tags:
      #   push to main  → 0.1.0-build.<run number>, sha-<commit>, latest
      #   tag vX.Y.Z    → X.Y.Z, X.Y
      # The first is unique and grows monotonically — that is the "new version"
      # for every commit; the second lets you get from an image back to the code.
      - name: Tags
        id: tags
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            list="$VERSION-build.$GITHUB_RUN_NUMBER sha-$(echo "$GITHUB_SHA" | cut -c1-7) latest"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            plain="${GITHUB_REF_NAME#v}"
            list="$plain ${plain%.*}"
          else
            echo "::error::I do not know which tags to apply for $GITHUB_REF"
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Tags: $list"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish
        id: push
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            docker tag hltv-notificator:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          # All tags share the same layers and the same digest — take it from
          # the first one.
          first="${TAGS%% *}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$first" | cut -d@ -f2)
          test -n "$digest" || { echo "::error::Could not determine the digest of the published image"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A keyless signature: the certificate is issued by GitHub itself for the
      # duration of the step, so there is nothing to store or rotate. It records
      # the repository, the workflow file and the commit — that is, the
      # signature also answers "what built this image".
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: What was published
        env:
          TAGS: ${{ steps.tags.outputs.list }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            for tag in $TAGS; do echo "$IMAGE:$tag"; done
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

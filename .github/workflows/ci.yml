name: CI

# Тесты — на каждый пул-реквест в main и на каждый пуш в main.
# Публикация образа — ТОЛЬКО на пуш. У прогона по пул-реквесту доступа к
# секретам нет и быть не должно: код в PR ещё никем не прочитан, а токен
# Docker Hub даёт право перезаписать образ, который потом поедет на сервер.
#
# Разделение доведено до конца: образ собирается в работе БЕЗ токена и уезжает
# дальше архивом. Работа, у которой токен есть, репозиторий даже не выкачивает —
# она разжимает готовый архив и толкает его в реестр.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Права токена по умолчанию — только чтение репозитория. Работам, которым нужно
# больше, права выдаются поимённо и в минимальном объёме.
permissions:
  contents: read

# Пуш за пушем: предыдущий прогон отменяется. Иначе два прогона могут добраться
# до публикации вразнобой, и в `latest` окажется не последний коммит.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен не остаётся в .git/config: дальше по шагам он не нужен, а
          # любой из них — от установки зависимостей до тестов — мог бы им
          # воспользоваться.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Зависимости
        # Единственный источник версий — requirements.txt, тот же, что у образа.
        # Дублировать список в Dockerfile нельзя: он разойдётся.
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          python -m pip install --disable-pip-version-check --no-cache-dir pytest

      - name: pytest
        # Тесты гоняются по фикстурам из docs/recon/fixtures — это настоящие
        # страницы HLTV, снятые при разведке. Живой источник для тестов не
        # годится: матчи редки, а овертайм и обрыв связи по заказу не
        # воспроизводятся.
        run: python -m pytest

  image:
    name: Сборка образа и проверка на уязвимости
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Версию считает эта работа — у неё есть репозиторий. Работа publish берёт
    # готовое число и в исходники не заглядывает.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Версия
        id: ver
        run: |
          version=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/hltv_notify/__init__.py').read_text(encoding='utf-8')).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Тег vX.Y.Z обязан совпадать с версией в коде: иначе образ с номером
          # 1.2.3 сообщал бы о себе чужой номер.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $version в src/hltv_notify/__init__.py"
            exit 1
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Метки OCI: из какого репозитория, коммита и когда собран образ. Они
      # обязаны попасть в слои, то есть проставляются здесь, при сборке, а не
      # при публикации. Имя образа для меток роли не играет.
      - name: Метки
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: hltv-notificator
          tags: type=raw,value=${{ steps.ver.outputs.version }}

      # Ни логина, ни секретов в этой работе нет — и весь код, который
      # выполняется при сборке (pip, RUN из Dockerfile), выполняется именно тут.
      - name: Сборка в архив
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: hltv-notificator:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Экспортёр docker подписи происхождения не умеет; чем собран образ,
          # удостоверяет подпись cosign в работе publish.
          provenance: false

      - name: Разжать архив для проверки
        run: docker load --input "$RUNNER_TEMP/image.tar"

      # `ignore-unfixed` намеренно: падаем только там, где есть что чинить.
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hltv-notificator:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # На пул-реквесте публиковать нечего, и архив гонять незачем.
      - name: Передать архив дальше
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          # Архив нужен только следующей работе этого же прогона.
          retention-days: 1
          # Слои внутри уже сжаты; сильнее жать — тратить минуты впустую.
          compression-level: 1

  publish:
    name: Публикация в Docker Hub
    needs: [image]
    # Пул-реквест сюда не попадает никогда — см. комментарий к `on`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Секрет живёт в окружении, а не в настройках репозитория: окружению можно
    # задать список веток, с которых оно доступно, и ручное подтверждение.
    environment: dockerhub
    permissions:
      contents: read
      id-token: write   # OIDC для keyless-подписи cosign
    steps:
      # ⚠️ У этой работы НЕТ шага checkout, и это главное в ней. Рядом с токеном
      # не оказывается ни одной строки из репозитория: ни Dockerfile, ни
      # conftest.py. Образ приезжает готовым архивом, `docker load` его только
      # распаковывает, `docker push` перекладывает слои в реестр. Ничего из
      # образа при этом не исполняется.
      - name: Учётные данные и имя образа
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          OVERRIDE: ${{ vars.DOCKERHUB_IMAGE }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$USERNAME" || { echo "::error::Не задана переменная DOCKERHUB_USERNAME"; exit 1; }
          test -n "$TOKEN"    || { echo "::error::Не задан секрет DOCKERHUB_TOKEN"; exit 1; }
          # DOCKERHUB_IMAGE нужен, только если публикуем в организацию, а не в
          # личное пространство.
          echo "IMAGE=${OVERRIDE:-$USERNAME/hltv-notificator}" >> "$GITHUB_ENV"
          echo "Публикуем в ${OVERRIDE:-$USERNAME/hltv-notificator}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Разжать образ
        run: docker load --input "$RUNNER_TEMP/image.tar"

      # Теги:
      #   пуш в main  → 0.1.0-build.<номер прогона>, sha-<коммит>, latest
      #   тег vX.Y.Z  → X.Y.Z, X.Y
      # Первый уникален и растёт монотонно — это и есть «новая версия» на
      # каждый коммит; второй позволяет от образа вернуться к коду.
      - name: Теги
        id: tags
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            list="$VERSION-build.$GITHUB_RUN_NUMBER sha-$(echo "$GITHUB_SHA" | cut -c1-7) latest"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            plain="${GITHUB_REF_NAME#v}"
            list="$plain ${plain%.*}"
          else
            echo "::error::Не понимаю, какие теги ставить для $GITHUB_REF"
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Теги: $list"

      - name: Вход в Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Публикация
        id: push
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            docker tag hltv-notificator:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          # Слои у всех тегов одни и те же, digest тоже один — берём по первому.
          first="${TAGS%% *}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$first" | cut -d@ -f2)
          test -n "$digest" || { echo "::error::Не смог узнать digest опубликованного образа"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Подпись без ключей: удостоверение выдаёт сам GitHub на время шага,
      # хранить и ротировать нечего. В нём записаны репозиторий, файл workflow и
      # коммит — то есть подпись отвечает и на вопрос «чем собран образ».
      - name: Подпись образа
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Что опубликовано
        env:
          TAGS: ${{ steps.tags.outputs.list }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Опубликовано"
            echo
            echo '```'
            for tag in $TAGS; do echo "$IMAGE:$tag"; done
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

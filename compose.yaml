services:
  hltv-notify:
    # The image is PULLED from the registry — this file is enough on a server
    # with no sources. There is deliberately no build key: with it,
    # `docker compose up` would try to build and fail with no Dockerfile at hand.
    #
    # The image name is set by the IMAGE variable in .env: it depends on your
    # Docker Hub login. CI prints the exact name in the run summary.
    # A local build lives in a separate file:
    #   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
    image: ${IMAGE:?set IMAGE in .env, for example your-login/hltv-notificator:latest}
    container_name: hltv-notify
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container everything is computed and stored in UTC — this is
      # not a setting but an invariant: correctness across DST switches depends
      # on it.
      TZ: UTC
      # The DISPLAY timezone in messages, on the other hand, is configurable.
      # The value comes from .env (TZ_DISPLAY); this is only a fallback in case
      # it is not there. Any zone from the IANA database: Europe/Moscow,
      # Europe/Riga, Asia/Tbilisi...
      TZ_DISPLAY: ${TZ_DISPLAY:-Europe/Moscow}

      # A proxy, if HLTV or Telegram cannot be reached directly from this
      # network. The names are standard and uppercase works (the service reads
      # the variables itself — libcurl underneath ignores uppercase
      # HTTP_PROXY). Schemes: http://, https://, socks5://, socks5h:// (with
      # socks5h the proxy resolves the name, not us). Details in
      # docs/operations.md.
      #
      # HTTP_PROXY: http://${LAN_IP}:20171
      # HTTPS_PROXY: http://${LAN_IP}:20171
      # ALL_PROXY: socks5h://${LAN_IP}:20170
      # NO_PROXY: localhost,127.0.0.1,192.168.1.0/24,10.0.0.0/24

    volumes:
      # ⚠️ This directory holds not only the state but the JOURNAL of sent
      # notifications. Losing the volume means the service treats everything it
      # finds as new and sends the notifications again. Back the directory up,
      # and do not delete the volume when updating the image.
      - ./data:/app/data

    # The service is stopped by SIGTERM: polling and the live feed stop at once
    # while the queue gets up to eight seconds to write out what has already
    # been decided (see SHUTDOWN_DRAIN_SECONDS). Tearing it down with a cancel
    # is not allowed: a break in the middle of send_message would leave the
    # message sent but not marked in the database, and on the next start it
    # would go out a second time. Fifteen seconds is plenty, but do not kill
    # the service on the second second.
    stop_grace_period: 15s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

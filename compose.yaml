services:
  hltv-notify:
    # Образ ТЯНЕТСЯ из реестра — этого файла достаточно на сервере, где нет
    # исходников. Ключа build здесь нет намеренно: с ним docker compose up
    # полез бы собирать образ и упал без Dockerfile под рукой.
    #
    # Имя образа задаётся переменной IMAGE в .env: оно зависит от вашего
    # логина Docker Hub. Точное имя печатает CI в сводке прогона.
    # Локальная сборка — отдельным файлом:
    #   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
    image: ${IMAGE:?укажите IMAGE в .env, например ваш-логин/hltv-notificator:latest}
    container_name: hltv-notify
    restart: unless-stopped
    env_file: .env
    environment:
      # Внутри контейнера всё считается и хранится в UTC — это не настройка,
      # а инвариант: от него зависит корректность на переходах летнего времени.
      TZ: UTC
      # А вот пояс ОТОБРАЖЕНИЯ в сообщениях настраивается. Значение берётся из
      # .env (TZ_DISPLAY), здесь — только запасное на случай, если его там нет.
      # Любая зона из базы IANA: Europe/Moscow, Europe/Riga, Asia/Tbilisi...
      TZ_DISPLAY: ${TZ_DISPLAY:-Europe/Moscow}

    volumes:
      # ⚠️ В этом каталоге лежит не только состояние, но и ЖУРНАЛ отправленных
      # уведомлений. Потеря тома означает, что сервис сочтёт новым всё, что
      # найдёт, и разошлёт уведомления повторно. Каталог бэкапить, том при
      # обновлении образа не удалять.
      - ./data:/app/data

    # Сервис гасится по SIGTERM: живой фид закрывается, очередь дописывается.
    # Десяти секунд с запасом хватает, но убивать его на второй секунде не надо.
    stop_grace_period: 15s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

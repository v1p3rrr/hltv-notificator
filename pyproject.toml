[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hltv-notificator"
version = "0.1.0"
description = "Telegram notifications about CS2 team matches on HLTV"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "curl_cffi==0.16.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
    "tzdata==2025.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hltv-notify = "hltv_notify.__main__:main"

[project.urls]
Homepage = "https://github.com/v1p3rrr/hltv-notificator"

# The version is duplicated in src/hltv_notify/__init__.py — CI reads it from
# there and checks it against the tag. There is a test for that:
# tests/test_version.py.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
